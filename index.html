<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데마시아 심시티 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="./app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        .node-circle { stroke: #fff; stroke-width: 2px; cursor: pointer; transition: all 0.2s; }
        .node-circle:hover { stroke: #60a5fa; stroke-width: 4px; }
        .link { stroke: #1e293b; stroke-opacity: 0.8; stroke-width: 2px; }
        .city-label { fill: #fff; font-size: 15px; font-weight: 900; text-shadow: 2px 2px 4px #000; pointer-events: none; }
        .hero-star { fill: #fbbf24; font-size: 16px; font-weight: 900; pointer-events: none; }
        .build-info { fill: #94a3b8; font-size: 11px; font-weight: 500; pointer-events: none; }
        .canvas-prod { fill: #fbbf24; font-size: 12px; font-weight: 700; pointer-events: none; text-shadow: 1px 1px 2px #000; }
        .config-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.1); }
        .res-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.75rem; padding: 0.6rem 1rem; min-width: 100px; }
        .bottleneck { border: 2px solid #ef4444 !important; background: rgba(239, 68, 68, 0.1) !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .bottleneck-text { color: #ef4444; font-weight: 900; animation: pulse 1s infinite; }
    </style>
</head>
<body>

    <header class="h-20 flex items-center justify-between px-8 bg-slate-900/50 border-b border-slate-800 z-10">
        <div class="flex items-center gap-8">
            <div>
                <h1 class="text-xl font-black text-blue-500 italic">DEMACIA OPTIMIZER</h1>
                <p id="label-sub" class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">균형 성장 시스템</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative bg-blue-500/10 px-6 py-2 rounded-xl border border-blue-500/30 text-center">
                    <p id="label-score" class="text-[9px] font-black text-blue-400 uppercase tracking-widest">생산 점수</p>
                    <div id="final-score" class="text-3xl font-black text-white font-mono">0</div>
                </div>
                <button id="lang-toggle" class="text-[10px] px-3 py-1 rounded-full border border-slate-600 text-slate-200 hover:bg-slate-700 transition">
                    <span class="font-semibold">Korean</span>
                    <span class="mx-1 text-slate-500">/</span>
                    <span class="font-semibold">English</span>
                </button>
            </div>
        </div>
        <div id="total-summary" class="flex gap-2"></div>
    </header>

    <div class="flex-grow flex overflow-hidden">
        <main class="relative flex-grow bg-[#050814]">
            <svg id="network-map" class="w-full h-full"></svg>
            
            <div class="absolute bottom-0 left-0 right-0 h-80 config-panel p-4 flex gap-6 overflow-x-auto">
                <div class="min-w-[280px] space-y-2 border-r border-slate-700 pr-6">
                    <p id="label-ratio" class="text-[11px] font-black text-yellow-500 mb-2 uppercase italic">목표 비율 및 병목</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div id="ui-w" class="p-2 rounded bg-slate-900/50 border border-slate-700">
                            <span class="text-[11px] text-slate-400">🪵 Wood (7.0)</span>
                            <input type="number" id="sc-w" value="7" step="0.1" onchange="calculate()" class="block w-full bg-transparent text-sm font-bold outline-none">
                            <div id="stat-w" class="text-[11px] mt-1 font-mono">-</div>
                        </div>
                        <div id="ui-s" class="p-2 rounded bg-slate-900/50 border border-slate-700">
                            <span class="text-[11px] text-slate-400">🪨 Stone (6.0)</span>
                            <input type="number" id="sc-s" value="6" step="0.1" onchange="calculate()" class="block w-full bg-transparent text-sm font-bold outline-none">
                            <div id="stat-s" class="text-[11px] mt-1 font-mono">-</div>
                        </div>
                        <div id="ui-m" class="p-2 rounded bg-slate-900/50 border border-slate-700">
                            <span class="text-[11px] text-slate-400">⚔️ Metal (5.0)</span>
                            <input type="number" id="sc-m" value="5" step="0.1" onchange="calculate()" class="block w-full bg-transparent text-sm font-bold outline-none">
                            <div id="stat-m" class="text-[11px] mt-1 font-mono">-</div>
                        </div>
                        <div id="ui-p" class="p-2 rounded bg-slate-900/50 border border-slate-700">
                            <span class="text-[11px] text-slate-400">🧪 Petri (0.07)</span>
                            <input type="number" id="sc-p" value="0.07" step="0.001" onchange="calculate()" class="block w-full bg-transparent text-sm font-bold outline-none">
                            <div id="stat-p" class="text-[11px] mt-1 font-mono">-</div>
                        </div>
                    </div>
                </div>

                <div class="min-w-[150px] space-y-2 border-r border-slate-700 pr-6">
                    <p id="label-base" class="text-[11px] font-black text-blue-400 mb-2 uppercase">기본 생산량</p>
                    <div class="grid grid-cols-2 gap-2 text-[11px]">
                        <span>🪵 Wood</span><input type="number" id="cfg-w" onchange="calculate()" class="w-full bg-slate-900 border border-slate-700 px-1">
                        <span>🪨 Stone</span><input type="number" id="cfg-s" onchange="calculate()" class="w-full bg-slate-900 border border-slate-700 px-1">
                        <span>⚔️ Metal</span><input type="number" id="cfg-m" onchange="calculate()" class="w-full bg-slate-900 border border-slate-700 px-1">
                        <span>🌾 Food</span><input type="number" id="cfg-f" onchange="calculate()" class="w-full bg-slate-900 border border-slate-700 px-1">
                    </div>
                </div>

                <div class="flex-grow flex flex-col">
                    <p id="label-json" class="text-[10px] font-black text-slate-500 mb-1 uppercase">BUILDING DICTIONARY</p>
                    <textarea id="json-editor" class="flex-grow w-full p-2 text-[10px] rounded bg-black/50 border border-slate-800 text-emerald-500 outline-none font-mono" spellcheck="false"></textarea>
                    <button id="btn-sync" onclick="applyDictionary()" class="mt-1 bg-slate-700 hover:bg-blue-600 text-[10px] font-bold py-1 rounded transition">데이터 동기화</button>
                </div>
            </div>
        </main>

        <aside class="w-72 bg-slate-950 border-l border-slate-800 flex flex-col z-20 shadow-2xl">
            <div class="p-5 border-b border-white/5">
                <h2 id="label-inspector" class="text-[10px] font-black text-slate-500 mb-1 uppercase">City Inspector</h2>
                <p id="selected-name" data-city="" class="text-lg font-bold">도시를 선택하세요</p>
            </div>
            <div id="editor-slots" class="p-5 space-y-2 flex-grow overflow-y-auto"></div>
            <div id="local-output-display" class="p-5 bg-slate-900 border-t border-slate-800 min-h-[160px]"></div>
        </aside>
    </div>
</body>
</html>
